<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Глубина — рыбалка</title>
<style>
:root{--bg:#0b1d30;--panel:#143049;--panel2:#1c4062;--ink:#e6f2f7;--mute:#8fb0c4;--amber:#ffb454}
*{box-sizing:border-box}
html,body,canvas,button{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
#fsx{position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:99999;width:34px;height:34px;margin:0;padding:0;border:0;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font:22px/34px Georgia,serif;text-align:center;cursor:pointer;opacity:.8}
#fsx:hover{background:rgba(0,0,0,.8);opacity:1}#fsx[hidden]{display:none}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif}
body{padding:12px}
.wrap{max-width:900px;margin:0 auto}
.top{display:flex;gap:14px;align-items:center;margin-bottom:8px;font-size:15px;flex-wrap:wrap}
.top b{color:var(--amber)}
.top svg{vertical-align:-3px}
.xp{flex:1;min-width:140px;height:10px;border-radius:5px;background:#0a1826;overflow:hidden}
.xp i{display:block;height:100%;width:0;background:var(--amber)}
.layout{display:flex;flex-direction:column;gap:10px}
.stage{position:relative;width:100%;aspect-ratio:3/2}
canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:14px;touch-action:none;cursor:pointer;background:#123}
.side{background:var(--panel);border-radius:14px;padding:10px;font-size:14px}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.o{font:inherit;font-size:13px;padding:6px 10px;border:0;border-radius:8px;background:var(--panel2);color:var(--ink);cursor:pointer}
.o:hover:not(:disabled){background:#27557f}
.o.on{background:var(--amber);color:#2a1a08;font-weight:700}
.o:disabled{opacity:.45;cursor:not-allowed}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.sec{margin:10px 0 4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;background:#0f2438;margin-bottom:4px;font-size:13px}
.row b{display:block;font-size:14px}
.row small,.mut,.eqs small,.sec small{color:var(--mute);font-size:12px}
.mut{margin:4px 0}
.dex{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0;font-size:12px}
.chip{padding:3px 9px;border-radius:999px;background:var(--panel2)}
.chip.no{color:var(--mute);background:#0f2438}
.hint{color:var(--mute);font-size:13px;margin:10px 0 0}
button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
/* полный экран: игра занимает всё место, панель уходит вправо */
html.fs,html.fs body{height:100%}
html.fs body{padding:0;overflow:hidden}
html.fs .wrap{max-width:none;height:100%;display:flex;flex-direction:column}
html.fs .top{margin:0;padding:6px 12px}
html.fs .layout{flex:1;min-height:0;flex-direction:row;gap:0}
html.fs .stage{flex:1;width:auto;aspect-ratio:auto;min-width:0}
html.fs canvas{border-radius:0}
html.fs .side{width:clamp(260px,27vw,400px);border-radius:0;overflow-y:auto}
html.fs .hint{display:none}
.layout{position:relative}
.dbtn,.x{display:none}
button{touch-action:manipulation}
html.dm:not(.fs) .stage{aspect-ratio:4/5}
html.dm .side{position:absolute;top:0;right:0;bottom:0;width:min(88%,350px);z-index:5;transform:translateX(105%);transition:transform .25s;overflow-y:auto;border-radius:14px 0 0 14px;box-shadow:-8px 0 30px rgba(0,0,0,.5)}
html.dm .side.open{transform:none}
html.dm .dbtn{display:flex;align-items:center;gap:6px;position:absolute;top:8px;right:8px;z-index:4;padding:8px 12px;border:0;border-radius:999px;background:rgba(8,20,32,.75);color:#fff;font:13px Georgia,serif;cursor:pointer}
html.dm .x{display:inline-block;margin-left:auto}
html.dm .hint{display:none}
html.dm .o{min-height:36px}
@media(max-width:600px){body{padding:8px}.top{font-size:13px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span>Ур. <b id="lv">1</b></span>
    <div class="xp" title="Опыт"><i id="xp"></i></div>
    <span id="coinbox"></span>
    <span id="bonus" style="color:var(--mute);font-size:13px"></span>
  </div>
  <div class="layout">
    <div class="stage" id="stage"><canvas id="c" aria-label="Игровое поле"></canvas></div>
    <div class="side" id="side"></div>
    <button class="dbtn" id="dbtn" aria-label="Сумка и магазин"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8h12l1.5 12h-15z" fill="#ffb454"/><path d="M9 8V6a3 3 0 016 0v2" fill="none" stroke="#ffb454" stroke-width="2"/></svg>Сумка и магазин <b id="dcnt"></b></button>
  </div>
  <p class="hint">Зажми мышь или палец — крючок идёт вниз, отпусти — поднимется. Лодка следует за курсором, также работают стрелки и Space. Сутки длятся 20 минут: ночью темно, зато клюют другие рыбы. Улов лежит в сумке — продавай его в магазинах.</p>
</div>
<script>
addEventListener('keydown',e=>{if(e.key==='Escape'&&parent!==window)parent.postMessage({type:'game-escape'},'*')});
const WORLD=2400,KEY='fishing-v3';
let W=900,H=600,PW=900,PH=600,K=1,Z=1,ZM=1;
const dm=()=>document.documentElement.classList.contains('dm');
function dmCheck(){const r=document.documentElement.classList;r.toggle('dm',innerWidth<760||(r.contains('fs')&&innerHeight<=520))}
addEventListener('resize',dmCheck);dmCheck();
const $=id=>document.getElementById(id),R=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const cv=$('c'),ctx=cv.getContext('2d');
const hex=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const mix=(a,b,k)=>{const A=hex(a),B=hex(b);return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*k)).join(',')+')'};
const COIN='<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="#ffb454"/><circle cx="8" cy="8" r="4.5" fill="none" stroke="#b9792a" stroke-width="1.5"/></svg>';
$('coinbox').innerHTML=COIN+' <b id="coins">0</b>';

// ---------- рыбы: t = нужный уровень удочки, y = глубина, s = размер, w: 1 днём / 2 ночью ----------
const TYPES=[
 {n:'Плотва',t:0,y:[80,300],s:22,xp:5,c:3,col:'#9fd1c7'},
 {n:'Карась',w:1,t:0,y:[100,380],s:25,xp:6,c:4,col:'#d9a441'},
 {n:'Окунь',w:1,t:0,y:[120,420],s:26,xp:8,c:5,col:'#8fae52',stripes:1},
 {n:'Щука',w:3,t:1,y:[300,720],s:42,xp:20,c:15,col:'#6f9b5a',ry:.28,teeth:1},
 {n:'Камбала',t:1,y:[400,800],s:36,xp:18,c:14,col:'#b59a74',sh:'ray',spots:1,ex:.6,ey:-.12},
 {n:'Рыба-шар',w:1,t:1,y:[350,760],s:30,xp:16,c:13,col:'#d6b862',sh:'puffer',ex:.4,ey:-.15},
 {n:'Сом',w:3,t:2,y:[600,1100],s:58,xp:45,c:40,col:'#7a7890',whisk:1},
 {n:'Скат',t:2,y:[700,1200],s:60,xp:50,c:45,col:'#5f7f9a',sh:'ray',ex:.6,ey:-.12},
 {n:'Медуза',w:2,t:2,y:[650,1250],s:34,xp:40,c:35,col:'#e58ac6',sh:'jelly',v:.5},
 {n:'Тунец',w:1,t:3,y:[900,1350],s:64,xp:70,c:60,col:'#3d6fa8',ry:.3,v:1.7},
 {n:'Удильщик',w:2,t:3,y:[1000,1500],s:56,xp:90,c:90,col:'#4a3a63',lure:1},
 {n:'Кальмар',w:2,t:3,y:[1050,1550],s:60,xp:95,c:95,col:'#b25f7d',sh:'squid',ex:.18,ey:-.1},
 {n:'Акула',t:4,y:[1300,1800],s:100,xp:160,c:170,col:'#7a8a9a',ry:.27,shark:1,v:1.3},
 {n:'Глубинный угорь',w:2,t:4,y:[1400,1900],s:84,xp:180,c:200,col:'#5c8f7a',sh:'eel',ex:.88,ey:-.06},
 {n:'Гигантский кальмар',w:2,t:5,y:[1700,2200],s:130,xp:420,c:470,col:'#8f2f4f',sh:'squid',ex:.18,ey:-.1,v:.8},
 {n:'Зубастый хищник',t:5,y:[1800,2300],s:104,xp:400,c:450,col:'#8a2f3f',teeth:1},
 {n:'Левиафан',t:6,y:[2100,2380],s:150,xp:1000,c:1200,col:'#33245a',teeth:1,eyes:1,v:.7},
 {n:'Тень бездны',w:2,t:6,y:[2000,2380],s:120,xp:1200,c:1400,col:'#1d1530',eyes:1,halo:'rgba(120,60,200,.55)',ry:.36,v:.6}
];
TYPES.forEach(T=>{T.dk=mix(T.col,'#000000',.35);T.lt=mix(T.col,'#ffffff',.38)});

const TY={};TYPES.forEach(T=>TY[T.n]=T);

// ---------- снасти ----------
const ROD=[
 {n:'Бамбуковая',col:'#b98b4e',p:'без особых эффектов',price:0},
 {n:'Стеклопластиковая',col:'#6fd0e0',p:'+10% к цене рыбы',coin:1.1,price:90},
 {n:'Карбоновая',col:'#454c5c',p:'шире зона клёва (+35%)',bite:1.35,price:220},
 {n:'Стальная',col:'#b9c0ca',p:'+15% опыта',xp:1.15,price:520},
 {n:'Титановая',col:'#e0e6ff',p:'подъём на 30% быстрее',reel:1.3,price:1100},
 {n:'Глубинная',col:'#8a6cff',p:'лампа у крючка и притяжение рыбы',light:110,magnet:1,price:2400},
 {n:'Легендарная',col:'#ffb454',p:'+25% к цене и опыту, мощная лампа',coin:1.25,xp:1.25,light:200,magnet:1,price:5200}];
const LINE=[{n:'Нить',d:300,price:0},{n:'Нейлон',d:550,price:60},{n:'Плетёнка',d:800,price:150},{n:'Флюорокарбон',d:1100,price:340},{n:'Стальной трос',d:1500,price:700},{n:'Кевлар',d:1900,price:1400},{n:'Глубинный канат',d:2300,price:2800}];
const REEL=[{n:'Простая',v:1,price:0},{n:'Спиннинговая',v:1.4,price:50},{n:'Мультипликатор',v:1.8,price:160},{n:'Электрическая',v:2.3,price:420},{n:'Турбо',v:2.9,price:1000}];
const HOOK=[{n:'Одинарный',cap:1,r:9,price:0},{n:'Двойной',cap:2,r:11,price:120},{n:'Тройник',cap:3,r:13,price:360},{n:'Якорный',cap:4,r:16,price:900},{n:'Сетевой',cap:5,r:19,price:2000}];
const BAIT={
 worm:{n:'Червь',p:'зона клёва +30%',bite:1.3,price:40,pack:10},
 spin:{n:'Блесна',p:'крючок опускается на 50% быстрее',drop:1.5,price:50,pack:10},
 glow:{n:'Светящаяся приманка',p:'свет +90 и притягивает ночных рыб',light:90,mNight:1,price:80,pack:8},
 elite:{n:'Деликатес',p:'рыба дороже и даёт опыта на 50% больше',q:1.5,xp:1.5,price:120,pack:6},
 deep:{n:'Глубинная наживка',p:'притягивает редкую рыбу (ур. 4+)',mRare:1,price:200,pack:6}};
const BAG=[{cap:15,price:0},{cap:25,price:80},{cap:38,price:250},{cap:55,price:700},{cap:80,price:1800}];
const LABEL={rod:['Удочка',ROD],line:['Леска',LINE],reel:['Катушка',REEL],hook:['Крючок',HOOK]};
const desc=(k,i)=>k==='rod'?'ловит рыбу ур. 0–'+i+'; '+ROD[i].p:k==='line'?'глубина до '+LINE[i].d/10+' м':k==='reel'?'скорость ×'+REEL[i].v:'рыб за заброс: '+HOOK[i].cap;
// ---------- магазины ----------
const SHOPS=[
 {n:'Рыбный рынок',open:[0,24],mul:1,only:()=>true,d:'Берёт любую рыбу по обычной цене. Открыт всегда.'},
 {n:'Ресторан',open:[12,24],mul:1.35,only:t=>t.t<=3,d:'Платит на 35% больше за обычную рыбу (ур. 0–3). Работает с 12:00 до 24:00.'},
 {n:'Скупщик',open:[20,5],mul:1.8,only:t=>t.t>=4,d:'Ночью, с 20:00 до 05:00, платит ×1.8 за редкую рыбу (ур. 4+).'},
 {n:'Лавка снастей',open:[0,24],tackle:1,d:'Удочки, лески, катушки, крючки, наживка и садок. Открыта всегда.'}];
const isOpen=(s,h)=>s.open[0]<s.open[1]?h>=s.open[0]&&h<s.open[1]:h>=s.open[0]||h<s.open[1];

// ---------- сохранение ----------
const def=()=>({coins:0,xp:0,lvl:1,day:0,days:1,caught:{},big:{},fish:[],own:{rod:[0],line:[0],reel:[0],hook:[0]},eq:{rod:0,line:0,reel:0,hook:0},bait:{},baitEq:null,bag:0});
let S=def();
try{
  const r=JSON.parse(localStorage.getItem(KEY));
  if(r&&r.own)S=Object.assign(def(),r);
  else{
    const o=JSON.parse(localStorage.getItem('fishing-v1'));
    if(o&&o.caught){
      S.coins=o.coins||0;S.xp=o.xp||0;S.lvl=o.lvl||1;S.caught=o.caught;
      [['rod',6],['line',6],['reel',4],['hook',4]].forEach(a=>{const l=Math.min(o[a[0]]||0,a[1]);S.own[a[0]]=Array.from({length:l+1},(_,i)=>i);S.eq[a[0]]=l});
    }
  }
}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const need=l=>Math.round(25*Math.pow(l,1.7));
const hourNow=()=>(S.day*24+6)%24;
const isDay=()=>{const h=hourNow();return h>=6&&h<19};
const fmtH=h=>String(Math.floor(h)%24).padStart(2,'0')+':'+String(Math.floor(h%1*60)).padStart(2,'0');
const baitNow=()=>S.baitEq&&S.bait[S.baitEq]>0?BAIT[S.baitEq]:null;
function fx(b){
  const r=ROD[S.eq.rod];
  return {bite:(r.bite||1)*(b&&b.bite||1)*(phaseOf(hourNow())===0?1.2:1),drop:b&&b.drop||1,light:(r.light||0)+(b&&b.light||0),magnet:!!r.magnet,mNight:!!(b&&b.mNight),mRare:!!(b&&b.mRare),q:b&&b.q||1,xp:(r.xp||1)*(b&&b.xp||1)*(phaseOf(hourNow())===1?1.1:1)};
}

// ---------- мир ----------
let fishes=[],bubbles=[],snow=[],parts=[],floats=[],msg='',msgT=0,t=0,needPane=true,fly=[];
const stars=Array.from({length:70},()=>({fx:Math.random(),fy:Math.random(),p:R(0,6)}));
const ground=Array.from({length:31},(_,i)=>R(10,46)+(i%5===0?20:0));
const kelp=Array.from({length:9},(_,i)=>({fx:(i+.5)/9+R(-.03,.03),h:R(90,190),ph:R(0,6)}));
const boat={x:450},hook={x:484,y:0,st:'idle',fish:[],lock:false,bait:null};
let px=450,down=false,kl=0,kr=0;
const maxDepth=()=>LINE[S.eq.line].d;
const zoneBottom=()=>Math.min(2380,maxDepth()+120);
const target=()=>Math.round((zoneBottom()-80)*.03*(W/900))+6;
function say(s){msg=s;msgT=3}
// рыба появляется за краем экрана и уплывает за другой край — игрок этого не видит
function spawn(init){
  const y=R(80,zoneBottom()),day=isDay();
  const inY=TYPES.filter(a=>y>=a.y[0]&&y<=a.y[1]);
  const ph=phaseOf(hourNow());let c=inY.filter(a=>!a.w||(a.w===1&&ph!==3)||(a.w===2&&ph===3)||(a.w===3&&(ph===0||ph===2)));
  if(!c.length)c=inY;
  const ok=c.filter(a=>a.t<=S.eq.rod);if(ok.length&&Math.random()<.8)c=ok;
  const T=c[Math.floor(R(0,c.length))],dir=Math.random()<.5?-1:1,m=T.s*1.8+70;
  return {T,m,x:init?R(-m,W+m):(dir>0?-m:W+m),y,by:y,dir,sp:R(28,70)*(T.v||1),ph:R(0,6),flee:0,hooked:false};
}
function fit(){
  const st=$('stage'),cw=st.clientWidth||900,ch=st.clientHeight||600;
  K=Math.min(2,typeof devicePixelRatio==='number'?devicePixelRatio:1,1280/cw);
  PW=Math.round(cw*K);PH=Math.round(ch*K);cv.width=PW;cv.height=PH;
  ZM=clamp(cw/620,.55,1);Z=K*ZM;W=PW/Z;H=PH/Z;   // на телефоне мир чуть мельче, чтобы поместился
  boat.x=clamp(boat.x,40,W-40);px=clamp(px,20,W-20);
}
fit();new ResizeObserver(fit).observe($('stage'));
while(fishes.length<target())fishes.push(spawn(true));
for(let i=0;i<30;i++)bubbles.push({x:R(0,W),y:R(0,WORLD),r:R(1.5,4),v:R(15,40)});
for(let i=0;i<70;i++)snow.push({x:R(0,W),y:R(0,WORLD),v:R(6,16),r:R(.6,1.6)});
function mapX(e){const r=cv.getBoundingClientRect();px=(e.clientX-r.left)*W/r.width}
cv.addEventListener('pointerdown',e=>{if(dm()&&$('side').classList.contains('open')){$('side').classList.remove('open');return}mapX(e);down=true;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointermove',mapX);
addEventListener('pointerup',()=>{down=false});
addEventListener('pointercancel',()=>{down=false});
addEventListener('keydown',e=>{
  if(e.key===' '){down=true;e.preventDefault()}
  if(e.key==='ArrowLeft'||e.key==='a'){kl=1;e.preventDefault()}
  if(e.key==='ArrowRight'||e.key==='d'){kr=1;e.preventDefault()}
});
addEventListener('keyup',e=>{
  if(e.key===' '){down=false;e.preventDefault()}
  if(e.key==='ArrowLeft'||e.key==='a')kl=0;
  if(e.key==='ArrowRight'||e.key==='d')kr=0;
});
function burst(x,y,n,col,grav,sp){for(let i=0;i<n;i++){const a=R(0,6.283),v=R(20,sp);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(grav?sp*.6:0),l:R(.4,.9),m:.9,col,g:grav})}}

function collect(){
  const F=fx(hook.bait);let xp=0,lost=0,got=0;
  for(const f of hook.fish){
    const T=f.T,w=(Math.random()<.04?R(1.6,2):R(.75,1.3))*(phaseOf(hourNow())===2?1.2:1),gain=Math.round(T.xp*w*F.xp),k=Math.pow(T.s,1.8)/300*w;
    xp+=gain;S.caught[T.n]=(S.caught[T.n]||0)+1;if(k>(S.big[T.n]||0))S.big[T.n]=+k.toFixed(1);
    if(S.fish.length<BAG[S.bag].cap){
      S.fish.push({n:T.n,w:+w.toFixed(2),q:F.q});got++;
      floats.push({x:hook.x,y:-40-floats.length*18,l:1.4,txt:T.n+' '+k.toFixed(1)+' кг'+(w>1.5?' — ТРОФЕЙ!':'')+' +'+gain+' оп.'});
    }else lost++;
    fly.push({T,x0:hook.x,l:.7,m:.7});
    fishes[fishes.indexOf(f)]=spawn(false);
  }
  if(hook.fish.length){
    burst(hook.x,-10,10+6*got,'255,210,110',false,120);
    S.xp+=xp;while(S.xp>=need(S.lvl)){S.xp-=need(S.lvl);S.lvl++;say('Новый уровень: '+S.lvl+'!')}
    if(lost)say('Сумка полна — часть рыбы отпущена. Продай улов!');
    save();needPane=true;
  }
  hook.fish=[];hook.st='idle';hook.y=0;hook.lock=true;hook.bait=null;hook.baitId=null;
}
function update(dt){
  t+=dt;if(msgT>0)msgT-=dt;
  const d0=S.day;S.day=(S.day+dt/1200)%1;   // 1200 с = 20 минут = сутки
  if(S.day<d0){S.days++;say('Наступил день '+S.days);needPane=true}
  while(fishes.length<target())fishes.push(spawn(false));
  const F=fx(hook.bait),maxD=maxDepth(),HK=HOOK[S.eq.hook],cap=HK.cap,hr=HK.r,ri=S.eq.rod;
  const rs=220*REEL[S.eq.reel].v*(ROD[ri].reel||1);
  if(kl||kr)px=clamp(px+(kr-kl)*420*dt,20,W-20);
  boat.x+=(px-boat.x)*Math.min(1,dt*5);
  if(!down)hook.lock=false;
  if(hook.st==='idle'){
    hook.x=boat.x+34;hook.y=0;
    if(down&&!hook.lock){
      hook.st='drop';const b=baitNow();hook.bait=b;hook.baitId=b?S.baitEq:null;
      if(b){S.bait[S.baitEq]--;if(S.bait[S.baitEq]<=0)S.baitEq=null;needPane=true}
      burst(hook.x,0,12,'200,235,255',true,160);
    }
  }else{
    hook.x=clamp(hook.x+clamp(px+34-hook.x,-250*dt,250*dt),10,W-10);
    if(hook.st==='drop'){
      if(down&&hook.y<maxD&&hook.fish.length<cap)hook.y+=190*F.drop*dt;else hook.st='reel';
    }else{hook.y-=rs*dt;if(hook.y<=0)collect()}
    for(const f of fishes){
      if(f.hooked||f.flee>0)continue;
      const d=Math.hypot(f.x-hook.x,f.y-hook.y);
      const mg=F.magnet||(F.mNight&&f.T.w===2)||(F.mRare&&f.T.t>=4);
      if(mg&&f.T.t<=ri&&d<170&&hook.fish.length<cap){f.x+=(hook.x-f.x)*dt*.8;f.by+=(hook.y-f.by)*dt*.8}
      if(hook.fish.length>=cap)continue;
      if(d<(f.T.s*.55+hr)*F.bite){
        if(f.T.t<=ri){f.hooked=true;hook.fish.push(f);burst(f.x,f.y,8,'255,255,255',false,80)}
        else{f.flee=1.5;f.dir=f.x<hook.x?-1:1;if(msgT<=0)say(f.T.n+': нужна удочка «'+ROD[f.T.t].n+'»')}
      }
    }
  }
  for(let i=0;i<fishes.length;i++){
    const f=fishes[i];if(f.hooked)continue;
    if(f.flee>0)f.flee-=dt;
    f.x+=f.dir*f.sp*(f.flee>0?4:1)*dt;
    f.y=f.by+Math.sin(t*(f.T.sh==='jelly'?1:1.5)+f.ph)*(f.T.sh==='jelly'?22:8);
    if((f.dir>0&&f.x>W+f.m)||(f.dir<0&&f.x<-f.m)){if(fishes.length>target()){fishes.splice(i,1);i--}else fishes[i]=spawn(false)}
  }
  for(const b of bubbles){b.y-=b.v*dt;if(b.y<0){b.y=WORLD;b.x=R(0,W)}}
  for(const n of snow){n.y+=n.v*dt;n.x+=Math.sin(t+n.y*.01)*6*dt;if(n.y>WORLD)n.y=0}
  for(let i=floats.length-1;i>=0;i--){floats[i].l-=dt;if(floats[i].l<=0)floats.splice(i,1)}
  for(let i=fly.length-1;i>=0;i--){fly[i].l-=dt;if(fly[i].l<=0)fly.splice(i,1)}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.g)p.vy+=420*dt;if(p.l<=0)parts.splice(i,1)}
}

// ---------- инвентарь, магазины, рыбы ----------
const ui={tab:'inv',shop:0,cat:'rod'};
const wt=f=>Math.pow(TY[f.n].s,1.8)/300*f.w;
const price=(f,sh)=>Math.round(TY[f.n].c*f.w*(f.q||1)*sh.mul*(1+.05*(S.lvl-1))*(ROD[S.eq.rod].coin||1));
function grp(filter){
  const m={};
  S.fish.forEach(f=>{const T=TY[f.n];if(filter&&!filter(T))return;(m[f.n]=m[f.n]||{n:f.n,c:0,list:[]}).c++;m[f.n].list.push(f)});
  return TYPES.filter(T=>m[T.n]).map(T=>m[T.n]);
}
function sell(sh,name,one){
  let g=0,n=0;
  S.fish=S.fish.filter(f=>{
    if((name&&f.n!==name)||!sh.only(TY[f.n])||(one&&n>=1))return true;
    g+=price(f,sh);n++;return false;
  });
  if(n){S.coins+=g;say('Продано '+n+' шт.: +'+g+' мон.')}
}
function invHTML(){
  const cap=BAG[S.bag].cap,g=grp();
  let h='<div class="sec"><b>Сумка</b> '+S.fish.length+'/'+cap+' <small>продавай рыбу в магазинах</small></div>';
  h+=g.length?g.map(x=>'<div class="row"><span>'+x.n+' ×'+x.c+'</span><small>'+x.list.reduce((a,f)=>a+wt(f),0).toFixed(1)+' кг</small></div>').join(''):'<p class="mut">Пусто. Лови рыбу!</p>';
  h+='<div class="sec"><b>Снаряжение</b></div>';

    h+='<div class="eqs"><small>'+LABEL[k][0]+'</small><div class="opts">'+S.own[k].map(i=>'<button class="o'+(S.eq[k]===i?' on':'')+'" data-a="eq" data-c="'+k+'" data-i="'+i+'">'+LABEL[k][1][i].n+'</button>').join('')+'</div><small>'+desc(k,S.eq[k])+'</small></div>';
  }
  h+='<div class="sec"><b>Наживка</b> <small>тратится на каждый заброс</small></div>';

function sellHTML(sh){
  const g=grp(sh.only);

  let all=0,h='';

    const sum=x.list.reduce((a,f)=>a+price(f,sh),0);all+=sum;
    h+='<div class="row"><span><b>'+x.n+' ×'+x.c+'</b><small>около '+Math.round(sum/x.c)+' мон. за шт.</small></span><span><button class="o" data-a="sell" data-n="'+x.n+'" data-one="1">1 шт.</button> <button class="o" data-a="sell" data-n="'+x.n+'">Все: '+sum+'</button></span></div>';
  });
  return h+'<div class="opts"><button class="o on" data-a="sellall">Продать всё: '+all+' мон.</button></div>';

function tackleHTML(){

$('side').addEventListener('click',e=>{

  else if(a==='buybait'){const bt=BAIT[d.v];if(S.coins>=bt.price){S.coins-=bt.price;S.bait[d.v]=(S.bait[d.v]||0)+bt.pack;if(!S.baitEq)S.baitEq=d.v;say('Куплено: '+bt.n+' ×'+bt.pack)}}
  else if(a==='bag'){const nx=BAG[S.bag+1];if(nx&&S.coins>=nx.price){S.coins-=nx.price;S.bag++;say('Садок увеличен: '+nx.cap+' рыб')}}
  else if(a==='sell')sell(SHOPS[ui.shop],d.n,d.one==='1');

});

// ---------- рисование рыб ----------
function eye(T,s,x,y){
  const red=T.t>=4,er=Math.max(2.5,s*.07);
  ctx.fillStyle=red?'#ff4a4a':'#fff';ctx.beginPath();ctx.arc(x,y,er,0,6.283);ctx.fill();
  if(!red){ctx.fillStyle='#111';ctx.beginPath();ctx.arc(x+er*.3,y,er*.5,0,6.283);ctx.fill();ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.arc(x+er*.1,y-er*.25,er*.22,0,6.283);ctx.fill()}
}
function teeth(s,x0,y0,n){ctx.fillStyle='#f4efe4';for(let i=0;i<n;i++){const x=x0+s*.09*i;ctx.beginPath();ctx.moveTo(x,y0);ctx.lineTo(x+s*.045,y0+s*.11);ctx.lineTo(x+s*.09,y0);ctx.fill()}}
function vg(T,ry){const g=ctx.createLinearGradient(0,-ry,0,ry);g.addColorStop(0,T.dk);g.addColorStop(.55,T.col);g.addColorStop(1,T.lt);return g}
function fishB(T,s,tt){
  const ry=s*(T.ry||.42),w=Math.sin(tt*6)*ry*.45,big=T.shark?1.9:1;
  const tg=ctx.createLinearGradient(-s*.8,0,-s*1.45,0);tg.addColorStop(0,T.dk);tg.addColorStop(1,T.col);
  ctx.fillStyle=tg;ctx.beginPath();ctx.moveTo(-s*.8,0);ctx.quadraticCurveTo(-s*1.1,-ry*.5+w,-s*1.45,-ry*1.35+w);ctx.quadraticCurveTo(-s*1.22,w,-s*1.45,ry*1.35+w);ctx.quadraticCurveTo(-s*1.1,ry*.5+w,-s*.8,0);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.2)';ctx.lineWidth=1;ctx.beginPath();for(let i=-2;i<=2;i++){ctx.moveTo(-s*.85,0);ctx.lineTo(-s*1.38,i*ry*.5+w)}ctx.stroke();
  ctx.fillStyle=T.dk;
  ctx.beginPath();ctx.moveTo(-s*.5,-ry*.8);ctx.quadraticCurveTo(-s*.1,-ry*1.9*big,s*.25,-ry*.85);ctx.fill();
  ctx.beginPath();ctx.moveTo(-s*.1,ry*.8);ctx.lineTo(-s*.4,ry*1.6);ctx.lineTo(-s*.55,ry*.7);ctx.fill();
  ctx.fillStyle=vg(T,ry);ctx.beginPath();ctx.ellipse(0,0,s,ry,0,0,6.283);ctx.fill();
  ctx.save();ctx.beginPath();ctx.ellipse(0,0,s,ry,0,0,6.283);ctx.clip();
  if(s>=18){
    const sc=Math.max(5,s*.17);ctx.strokeStyle='rgba(255,255,255,.14)';ctx.lineWidth=1;ctx.beginPath();
    for(let row=-2;row<=2;row++)for(let col=-4;col<=4;col++){const cx=col*sc+(row%2?sc/2:0)-s*.1,cy=row*sc*.7,rr=sc*.55;ctx.moveTo(cx+Math.cos(.5)*rr,cy+Math.sin(.5)*rr);ctx.arc(cx,cy,rr,.5,2.6)}
    ctx.stroke();
  }
  const hl=ctx.createLinearGradient(0,-ry,0,0);hl.addColorStop(0,'rgba(255,255,255,.3)');hl.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=hl;ctx.fillRect(-s,-ry,s*2,ry);
  ctx.restore();
  if(T.shark){ctx.fillStyle=T.col;ctx.beginPath();ctx.moveTo(s*.9,-ry*.5);ctx.lineTo(s*1.25,.05*s);ctx.lineTo(s*.9,ry*.5);ctx.fill()}
  if(T.stripes){ctx.strokeStyle='rgba(0,0,0,.3)';ctx.lineWidth=s*.08;for(let i=0;i<4;i++){const x=-s*.45+i*s*.3;ctx.beginPath();ctx.moveTo(x,-ry*.9);ctx.quadraticCurveTo(x+s*.08,0,x,ry*.9);ctx.stroke()}}
  ctx.strokeStyle='rgba(255,255,255,.22)';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(-s*.7,0);ctx.quadraticCurveTo(0,-ry*.15,s*.7,0);ctx.stroke();
  ctx.strokeStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.arc(s*.38,0,ry*.7,-1.1,1.1);ctx.stroke();
  if(T.shark){for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(s*.45-i*s*.06,-ry*.35);ctx.lineTo(s*.45-i*s*.06,ry*.35);ctx.stroke()}}
  if(T.whisk){ctx.strokeStyle=T.dk;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(s*.92,ry*.1);ctx.quadraticCurveTo(s*1.2,ry*.2,s*1.3,ry*.7);ctx.moveTo(s*.92,-ry*.05);ctx.quadraticCurveTo(s*1.2,0,s*1.28,ry*.3);ctx.stroke()}
  if(T.lure){
    ctx.strokeStyle=T.col;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(s*.5,-ry*.9);ctx.quadraticCurveTo(s*.9,-ry*2.6,s*1.2,-ry*1.6);ctx.stroke();
    ctx.fillStyle='#ffe2a0';ctx.beginPath();ctx.arc(s*1.2,-ry*1.6,4,0,6.283);ctx.fill();
  }

  if(T.eyes)for(const p of [[.3,-.55],[.08,-.5],[.42,.35]]){ctx.fillStyle='#ff4a4a';ctx.beginPath();ctx.arc(s*p[0],ry*p[1],Math.max(2,s*.045),0,6.283);ctx.fill()}
}
function eelB(T,s,tt){
  const pts=[];for(let i=0;i<=16;i++){const k=i/16;pts.push([s-k*2*s,Math.sin(k*7-tt*6)*s*.12*(.4+k)])}
  const path=()=>{ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]))};
  ctx.lineCap='round';ctx.lineJoin='round';
  ctx.strokeStyle=T.dk;ctx.lineWidth=s*.3;path();ctx.stroke();
  ctx.strokeStyle=T.col;ctx.lineWidth=s*.22;path();ctx.stroke();
  ctx.strokeStyle=T.lt;ctx.lineWidth=s*.05;ctx.globalAlpha=.5;path();ctx.stroke();ctx.globalAlpha=1;
  teeth(s,s*.95,s*.04,3);eye(T,s,s*.88,-s*.06);
}
function rayB(T,s,tt){
  const f=Math.sin(tt*3)*s*.08;
  ctx.strokeStyle=T.dk;ctx.lineWidth=s*.05;ctx.beginPath();ctx.moveTo(-s*.8,0);ctx.quadraticCurveTo(-s*1.2,Math.sin(tt*4)*s*.2,-s*1.7,Math.sin(tt*4+1)*s*.12);ctx.stroke();
  ctx.fillStyle=vg(T,s*.4);ctx.beginPath();ctx.moveTo(s,0);ctx.bezierCurveTo(s*.5,-s*.4-f,-s*.5,-s*.4-f,-s*.8,0);ctx.bezierCurveTo(-s*.5,s*.4+f,s*.5,s*.4+f,s,0);ctx.fill();
  if(T.spots){ctx.fillStyle='rgba(0,0,0,.2)';for(const p of [[.1,-.1],[-.3,.08],[.4,.1],[-.1,.15],[.25,-.2]]){ctx.beginPath();ctx.arc(s*p[0],s*p[1],s*.05,0,6.283);ctx.fill()}}
  eye(T,s,s*.62,-s*.1);
}
function jellyB(T,s,tt){
  const p=1+Math.sin(tt*3)*.08;
  ctx.globalAlpha=.8;
  const g=ctx.createRadialGradient(0,-s*.4,0,0,-s*.4,s*1.2);g.addColorStop(0,T.lt);g.addColorStop(1,T.col);
  ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-s,0);ctx.bezierCurveTo(-s,-s*1.4*p,s,-s*1.4*p,s,0);ctx.quadraticCurveTo(s*.5,s*.25,0,0);ctx.quadraticCurveTo(-s*.5,s*.25,-s,0);ctx.fill();
  ctx.strokeStyle=T.lt;ctx.lineWidth=2;
  for(let i=0;i<6;i++){const x=-s*.7+i*s*.28;ctx.beginPath();ctx.moveTo(x,s*.05);for(let j=1;j<=6;j++)ctx.lineTo(x+Math.sin(tt*3+j+i)*s*.1,s*.05+j*s*.19);ctx.stroke()}

}
function squidB(T,s,tt){
  ctx.fillStyle=T.dk;
  ctx.beginPath();ctx.moveTo(-s*1.1,0);ctx.lineTo(-s*1.4,-s*.32);ctx.lineTo(-s*.8,-s*.12);ctx.moveTo(-s*1.1,0);ctx.lineTo(-s*1.4,s*.32);ctx.lineTo(-s*.8,s*.12);ctx.fill();
  ctx.fillStyle=vg(T,s*.4);ctx.beginPath();ctx.moveTo(-s*1.15,0);ctx.quadraticCurveTo(-s*.5,-s*.45,s*.05,-s*.28);ctx.lineTo(s*.05,s*.28);ctx.quadraticCurveTo(-s*.5,s*.45,-s*1.15,0);ctx.fill();
  ctx.beginPath();ctx.ellipse(s*.15,0,s*.22,s*.26,0,0,6.283);ctx.fill();
  ctx.strokeStyle=T.col;ctx.lineWidth=Math.max(2,s*.035);ctx.lineCap='round';
  for(let i=0;i<7;i++){const yy=(i-3)*s*.07;ctx.beginPath();ctx.moveTo(s*.3,yy);for(let j=1;j<=6;j++)ctx.lineTo(s*.3+j*s*.1,yy*(1+j*.35)+Math.sin(tt*5+j+i)*s*.05);ctx.stroke()}
  const er=s*.09;ctx.fillStyle=T.t>=5?'#ff4a4a':'#fff';ctx.beginPath();ctx.arc(s*.18,-s*.1,er,0,6.283);ctx.fill();
  if(T.t<5){ctx.fillStyle='#111';ctx.beginPath();ctx.arc(s*.2,-s*.1,er*.5,0,6.283);ctx.fill()}
}
function pufferB(T,s,tt){
  ctx.fillStyle=T.dk;ctx.beginPath();ctx.moveTo(-s*.6,0);ctx.lineTo(-s,-s*.25+Math.sin(tt*6)*s*.1);ctx.lineTo(-s,s*.25+Math.sin(tt*6)*s*.1);ctx.fill();
  ctx.strokeStyle=T.lt;ctx.lineWidth=2;
  for(let i=0;i<12;i++){const a=i/12*6.283,c=Math.cos(a),n=Math.sin(a);ctx.beginPath();ctx.moveTo(c*s*.66,n*s*.58);ctx.lineTo(c*s*.84,n*s*.74);ctx.stroke()}

  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.arc(s*.62,s*.12,s*.07,0,6.283);ctx.fill();

const SHAPE={fish:fishB,eel:eelB,ray:rayB,jelly:jellyB,squid:squidB,puffer:pufferB};
function drawFish(T,x,y,dir,sc,rot,tt){
  ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(-Math.PI/2);ctx.scale(dir*sc,sc);
  if(T.halo){const g=ctx.createRadialGradient(0,0,T.s*.2,0,0,T.s*1.6);g.addColorStop(0,T.halo);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,T.s*1.6,0,6.283);ctx.fill()}
  SHAPE[T.sh||'fish'](T,T.s,tt);
  ctx.restore();
}
// свечение глаз и приманок — рисуется поверх темноты
function glowAt(x,y,r,rgb,a){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba('+rgb+','+a+')');g.addColorStop(1,'rgba('+rgb+',0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,6.283);ctx.fill()}
function glowPass(camY){
  ctx.globalCompositeOperation='lighter';
  for(const f of fishes){
    if(f.hooked)continue;const T=f.T,sy=f.y-camY;
    if(sy<-200||sy>H+200||f.x<-200||f.x>W+200)continue;
    if(T.t>=4||T.eyes)glowAt(f.x+f.dir*T.s*(T.ex||.58),sy+T.s*(T.ey||-.1),Math.max(12,T.s*.16),'255,60,60',.85);
    if(T.lure)glowAt(f.x+f.dir*T.s*1.2,sy-T.s*.7,26,'255,190,90',.9);
    if(T.sh==='jelly')glowAt(f.x,sy-T.s*.4,T.s*1.5,'230,120,200',.4);
  }
  ctx.globalCompositeOperation='source-over';
}


// ---------- сцена: время суток, вода, лодка ----------
const STOPS=[[0,[46,139,154]],[.25,[27,95,127]],[.5,[18,58,99]],[.75,[11,29,64]],[1,[5,6,15]]];
const lerpC=(a,b,k)=>a.map((v,i)=>v+(b[i]-v)*k);
const css=(c,a)=>'rgba('+c.map(Math.round).join(',')+','+(a==null?1:a)+')';
// ключевые точки суток: час, верх неба, горизонт, яркость
const KF=[[0,[8,10,34],[20,26,64],0],[4.5,[10,14,44],[40,36,84],.03],[5.5,[40,50,110],[225,125,110],.25],[7,[95,150,215],[255,205,150],.65],[10,[90,170,230],[200,230,250],.95],[14,[70,160,235],[190,225,250],1],[17,[90,150,220],[255,215,160],.85],[19,[70,70,140],[255,130,80],.45],[20.5,[28,28,82],[160,80,110],.12],[22,[12,14,44],[30,32,76],0],[24,[8,10,34],[20,26,64],0]];
function skyAt(h){
  let i=1;while(i<KF.length-1&&KF[i][0]<h)i++;
  const a=KF[i-1],b=KF[i],k=(h-a[0])/(b[0]-a[0]);
  return {top:lerpC(a[1],b[1],k),bot:lerpC(a[2],b[2],k),a:a[3]+(b[3]-a[3])*k};
}
const glowOf=(h,c,w)=>Math.exp(-Math.pow((h-c)/w,2));
const PHASES=[['Утро','клёв лучше'],['День','опыта +10%'],['Вечер','рыба тяжелее'],['Ночь','ночные виды']];
function phaseOf(h){return h>=5&&h<10?0:h>=10&&h<17?1:h>=17&&h<21?2:3}

  ctx.fillStyle='#e8462f';ctx.beginPath();ctx.ellipse(0,-14,8,13,.1,0,6.283);ctx.fill();

  ctx.save();ctx.translate(-2,-17);ctx.rotate(-.2+Math.sin(t*14)*.35*flap);
  ctx.fillStyle='#2f6fd6';ctx.beginPath();ctx.ellipse(-3,6,5,11,.2,0,6.283);ctx.fill();
  ctx.fillStyle='#ffd24a';ctx.beginPath();ctx.ellipse(-2,3,3,5,.2,0,6.283);ctx.fill();ctx.restore();
  ctx.fillStyle='#ffd24a';
  for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(-1+i*2,-35);ctx.lineTo(-4+i*3,-44+i);ctx.lineTo(2+i*2,-36);ctx.fill()}
  ctx.fillStyle='#e8462f';ctx.beginPath();ctx.arc(3,-29,7.5,0,6.283);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(6,-29,4.5,4,0,0,6.283);ctx.fill();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(6.5,-30,1.7,0,6.283);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(7,-30.5,.6,0,6.283);ctx.fill();
  ctx.fillStyle='#f4efe0';ctx.beginPath();ctx.moveTo(8,-32);ctx.quadraticCurveTo(16,-33,14,-24);ctx.quadraticCurveTo(12,-27,8,-26);ctx.fill();
  ctx.fillStyle='#2b2b2b';ctx.beginPath();ctx.moveTo(8,-26);ctx.quadraticCurveTo(12,-27,14,-24);ctx.quadraticCurveTo(11,-23,8,-24);ctx.fill();
  ctx.strokeStyle='#d9a441';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-2,-2);ctx.lineTo(-2,2);ctx.moveTo(3,-2);ctx.lineTo(3,2);ctx.stroke();
  ctx.restore();
}

  ctx.fillStyle='#e8dcc0';ctx.fillRect(-54,-5,108,4);

// настоящий рыболовный крючок: вертлюг, грузило, изогнутое жало с зазубриной, насадка
function drawHook(x,y,k,t,baitId){
  const r=HOOK[k].r;
  ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(t*2)*.07);
  ctx.fillStyle='#9aa3ae';ctx.beginPath();ctx.arc(0,2,2.6,0,6.283);ctx.fill();
  ctx.fillStyle='#5d6470';ctx.beginPath();ctx.ellipse(0,9,3.6,5,0,0,6.283);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.4)';ctx.beginPath();ctx.ellipse(-1,7.5,1,2,0,0,6.283);ctx.fill();
  const g=ctx.createLinearGradient(-r,0,r,0);g.addColorStop(0,'#9fa9b7');g.addColorStop(.5,'#f4f8fc');g.addColorStop(1,'#738093');
  ctx.strokeStyle=g;ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';
  const L=r*.9,c=r*.55;
  const one=(rot,sc,mir)=>{
    ctx.save();ctx.translate(0,14);ctx.rotate(rot);ctx.scale(mir?-sc:sc,sc);
    ctx.beginPath();ctx.arc(0,-1,2,0,6.283);ctx.moveTo(0,1);ctx.lineTo(0,L);ctx.arc(c,L,c,Math.PI,0,true);ctx.lineTo(2*c,L-r*.5);ctx.lineTo(2*c-2.4,L-r*.36);ctx.stroke();
    ctx.restore();
  };
  if(k===0)one(0,1,false);
  else if(k===1){one(.45,1,false);one(-.45,1,true)}
  else if(k===2){one(0,1,false);one(.8,.95,true);one(-.8,.95,false)}
  else if(k===3){ctx.beginPath();ctx.moveTo(-r*.5,18);ctx.lineTo(r*.5,18);ctx.stroke();one(.15,1.25,false);one(-.15,1.25,true)}
  else{
    ctx.beginPath();ctx.arc(0,14+r*.9,r*.95,0,6.283);ctx.stroke();
    ctx.strokeStyle='rgba(220,235,255,.45)';ctx.lineWidth=1;ctx.beginPath();for(let i=-2;i<=2;i++){ctx.moveTo(i*r*.35,14+r*.1);ctx.lineTo(i*r*.35,14+r*1.7)}ctx.stroke();
    ctx.strokeStyle=g;ctx.lineWidth=2.2;for(const a of [-1.1,-.4,.4,1.1])one(a,.7,a<0);
  }
  if(baitId){
    const by=14+r*1.05,bx=r*.3;
    if(baitId==='worm'){ctx.strokeStyle='#e08fa0';ctx.lineWidth=3.2;ctx.beginPath();for(let i=0;i<=8;i++){const yy=by-6+i*2.2,xx=bx+Math.sin(i*1.1+t*5)*2.4;i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)}ctx.stroke()}
    else if(baitId==='spin'){ctx.save();ctx.translate(bx,by);ctx.rotate(t*10);ctx.fillStyle='#e8eef6';ctx.beginPath();ctx.ellipse(0,0,7,3,0,0,6.283);ctx.fill();ctx.restore()}
    else if(baitId==='glow'){ctx.globalCompositeOperation='lighter';glowAt(bx,by,16,'255,235,160',.9);ctx.globalCompositeOperation='source-over';ctx.fillStyle='#fff6c8';ctx.beginPath();ctx.arc(bx,by,3.2,0,6.283);ctx.fill()}
    else if(baitId==='elite'){ctx.fillStyle='#ffc857';ctx.beginPath();ctx.ellipse(bx,by,6,3.2,0,0,6.283);ctx.fill();ctx.beginPath();ctx.moveTo(bx-5,by);ctx.lineTo(bx-10,by-3);ctx.lineTo(bx-10,by+3);ctx.fill()}
    else{ctx.fillStyle='#6b4aa8';ctx.beginPath();ctx.arc(bx,by,4.2,0,6.283);ctx.fill();ctx.fillStyle='#ff4a4a';ctx.beginPath();ctx.arc(bx+1.4,by-1,1.1,0,6.283);ctx.fill()}
  }
  if(Math.sin(t*3)>.92){ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(-3,24);ctx.lineTo(3,24);ctx.moveTo(0,21);ctx.lineTo(0,27);ctx.stroke()}
  ctx.restore();
}
function wreck(x,gy){
  ctx.fillStyle='#0b1322';
  ctx.beginPath();ctx.moveTo(x-110,gy-8);ctx.lineTo(x+120,gy-30);ctx.lineTo(x+98,gy-72);ctx.lineTo(x-92,gy-60);ctx.closePath();ctx.fill();
  ctx.fillRect(x-30,gy-150,6,100);ctx.fillRect(x+40,gy-130,5,86);
  ctx.beginPath();ctx.moveTo(x-24,gy-140);ctx.lineTo(x+22,gy-108);ctx.lineTo(x-24,gy-86);ctx.fill();
  for(let i=0;i<4;i++){ctx.fillStyle='rgba(120,230,205,'+(.3+.25*Math.sin(t*2+i))+')';ctx.beginPath();ctx.arc(x-62+i*36,gy-40-i*3,5,0,6.283);ctx.fill()}
}
function ledge(wy,side,w,hh,camY){
  const y=wy-camY;if(y<-hh*1.5||y>H+hh*1.5)return;
  const x0=side>0?W:0;
  ctx.fillStyle='#0b1829';ctx.beginPath();ctx.moveTo(x0,y-hh);ctx.lineTo(x0-side*w*.45,y-hh*.7);ctx.lineTo(x0-side*w,y-hh*.2);ctx.lineTo(x0-side*w*.8,y);ctx.lineTo(x0-side*w*.9,y+hh*.5);ctx.lineTo(x0,y+hh*.9);ctx.closePath();ctx.fill();
  if(wy>800){ctx.globalCompositeOperation='lighter';for(let i=0;i<3;i++)glowAt(x0-side*(w*(.2+i*.22)),y-hh*(.7-i*.25),11,i%2?'255,120,200':'80,255,220',.5+.3*Math.sin(t*2+i));ctx.globalCompositeOperation='source-over'}
}
function draw(){
  const h=hourNow(),sk=skyAt(h),d=sk.a,tw=Math.max(glowOf(h,6.2,.9),glowOf(h,19.3,1.1)),ph=phaseOf(h);
  const SKY=Math.round(H*.25),camY=Math.max(-SKY,Math.min(hook.y-H*.46,WORLD-H+60)),sy0=-camY;
  const F=fx(hook.bait),r=ROD[S.eq.rod],hk=HOOK[S.eq.hook];

  STOPS.forEach(s=>{const c=lerpC(s[1],[255,160,110],tw*.14*Math.max(0,1-s[0]*3)),f=1-(1-(.28+.72*d))*(1-s[0]*.8);wg.addColorStop(s[0],css(c.map(v=>v*f)))});

    ctx.globalCompositeOperation='lighter';ctx.strokeStyle=css(sc,.06*d);ctx.lineWidth=1.5;
    for(let i=0;i<9;i++){ctx.beginPath();const y0=sy0+30+i*38;for(let x=0;x<=W;x+=14){const y=y0+Math.sin(x*.02+t*.8+i)*8+Math.sin(x*.047-t*.6+i*2)*5;x?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke()}

    ctx.fillStyle=sg;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(W,0);for(let x=W;x>=0;x-=10)ctx.lineTo(x,wave(x));ctx.fill();

    const isSun=h>=5.5&&h<=19.5,p=isSun?(h-5.5)/14:((h-19.5+24)%24)/10,bx=W*(.08+.84*p),by=sy0-SKY*.08-Math.sin(p*Math.PI)*SKY*.72;

    if(ph===0){const mg=ctx.createLinearGradient(0,sy0-70,0,sy0+10);mg.addColorStop(0,'rgba(255,240,230,0)');mg.addColorStop(1,'rgba(255,240,230,.22)');ctx.fillStyle=mg;ctx.fillRect(0,sy0-70,W,80)}
    ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=2;ctx.beginPath();for(let x=0;x<=W;x+=10)x?ctx.lineTo(x,wave(x)):ctx.moveTo(x,wave(x));ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.22)';ctx.lineWidth=1.5;ctx.beginPath();for(let x=0;x<=W;x+=10){const y=wave(x)+6+Math.sin(x*.05-t*1.5)*2;x?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke();

  }
  const hy=hook.y-camY,sag=Math.sin(t*2)*Math.min(8,hook.y*.02);
  ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(tipX,tipY);ctx.quadraticCurveTo((tipX+hook.x)/2+sag,(tipY+hy)/2,hook.x,hy);ctx.stroke();
  drawHook(hook.x,hy,S.eq.hook,t,hook.baitId);
  if(F.magnet){ctx.strokeStyle='rgba(180,150,255,'+(.3+.2*Math.sin(t*4))+')';ctx.lineWidth=2;ctx.beginPath();ctx.arc(hook.x,hy+14+hk.r,22+Math.sin(t*4)*3,0,6.283);ctx.stroke()}
  let off=hy+14+hk.r*1.9;
  hook.fish.forEach((f,i)=>{const sc=.5,len=f.T.s*sc*1.1;drawFish(f.T,hook.x+Math.sin(t*6+i)*3,off+len,1,sc,true,t*2);off+=len*2.1});
  for(const f of fly){const p=1-f.l/f.m,x=f.x0+(boat.x-12-f.x0)*p,y=-10-30*p-Math.sin(p*Math.PI)*70;drawFish(f.T,x,y-camY,x<boat.x?1:-1,.35,false,t*8)}
  for(const p of parts){ctx.fillStyle='rgba('+p.col+','+Math.max(0,p.l/p.m)+')';ctx.beginPath();ctx.arc(p.x,p.y-camY,2.4,0,6.283);ctx.fill()}
  const depthDark=clamp((camY+H/2-250)/2000,0,.8),nightDark=(1-d)*.55*(1-clamp((camY+H/2)/1200,0,1));
  const dark=Math.min(.9,depthDark+nightDark);
  if(dark>.02){
    const L=150+F.light,g=ctx.createRadialGradient(hook.x,hy,L*.25,hook.x,hy,L*1.6);
    g.addColorStop(0,'rgba(2,4,12,0)');g.addColorStop(1,'rgba(2,4,12,'+dark+')');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  }
  glowPass(camY);
  // интерфейс (в обычных пикселях, без масштаба мира)
  ctx.setTransform(K,0,0,K,0,0);
  const HW=PW/K,HH=PH/K,bw=HW<500?206:236;
  ctx.fillStyle='rgba(8,20,32,.62)';ctx.fillRect(10,10,bw,68);
  ctx.fillStyle='rgba(255,180,84,.7)';ctx.fillRect(10,10,3,68);
  ctx.fillStyle='#e6f2f7';ctx.font='14px Georgia,serif';ctx.textAlign='left';
  ctx.fillText('Глубина '+Math.round(Math.max(0,hook.y)/10)+' м · улов '+hook.fish.length+'/'+hk.cap,20,28);
  ctx.fillText(PHASES[ph][0]+' · '+fmtH(h),36,50);
  ctx.textAlign='right';ctx.fillText('сумка '+S.fish.length+'/'+BAG[S.bag].cap,bw+2,50);
  ctx.textAlign='left';ctx.font='12px Georgia,serif';ctx.fillStyle='#ffb454';ctx.fillText(PHASES[ph][1]+' · день '+S.days,20,69);
  ctx.fillStyle=isDayIcon(h)?'#ffd36b':'#e8ecff';ctx.beginPath();ctx.arc(24,46,6,0,6.283);ctx.fill();
  if(!isDayIcon(h)){ctx.fillStyle='rgba(8,20,32,.9)';ctx.beginPath();ctx.arc(27,44,5,0,6.283);ctx.fill()}
  ctx.fillStyle='rgba(8,20,32,.5)';ctx.fillRect(HW-16,90,6,HH-160);
  for(let i=0;i<=8;i++){ctx.fillStyle='rgba(230,242,247,.35)';ctx.fillRect(HW-20,90+(HH-160)*i/8,4,1)}
  ctx.fillStyle='#ffb454';ctx.fillRect(HW-19,90+(HH-160)*clamp(hook.y/maxDepth(),0,1)-3,12,6);
  ctx.textAlign='center';
  if(hook.st==='idle'&&!down){ctx.fillStyle=d>.5?'rgba(60,40,20,.85)':'rgba(255,255,255,.85)';ctx.font='16px Georgia,serif';ctx.fillText('Зажми, чтобы опустить крючок',HW/2,Math.max(30,(sy0-SKY*.3)*ZM))}
  if(msgT>0){ctx.font='bold 17px Georgia,serif';ctx.fillStyle='rgba(8,20,32,.75)';const mw=Math.min(HW-20,ctx.measureText(msg).width+30);ctx.fillRect(HW/2-mw/2,HH-56,mw,34);ctx.fillStyle='#ffb454';ctx.fillText(msg,HW/2,HH-33)}
  ctx.font='bold 15px Georgia,serif';
  for(const f of floats){ctx.fillStyle='rgba(255,230,160,'+Math.min(1,f.l)+')';ctx.fillText(f.txt,f.x*ZM,(f.y-camY-(1.4-f.l)*40)*ZM)}
}
const isDayIcon=h=>h>=5.5&&h<19.5;
let last=performance.now(),lastPane=0,lastKey=openKey();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;if(!(dm()&&$('side').classList.contains('open')))update(dt);draw();
  const k=openKey();if(k!==lastKey){lastKey=k;needPane=true}
  if(needPane&&now-lastPane>250){lastPane=now;needPane=false;refresh()}
  requestAnimationFrame(loop);
}
refresh();requestAnimationFrame(loop);
setInterval(save,10000);
addEventListener('beforeunload',save);
if(window.parent!==window){
  const post=()=>{if(!document.documentElement.classList.contains('fs'))parent.postMessage({type:'game-height',h:document.body.offsetHeight},'*')};
  new ResizeObserver(post).observe(document.body);post();
}
</script>
<button id="fsx" hidden title="Выйти из полного экрана" aria-label="Выйти из полного экрана">×</button>
<script>
(function(){const b=document.getElementById('fsx');
addEventListener('message',e=>{if(e.data&&e.data.type==='game-fs'){document.documentElement.classList.toggle('fs',!!e.data.on);if(window.dmCheck)dmCheck();b.hidden=!e.data.on||!!e.data.pseudo}});
b.onclick=()=>parent.postMessage({type:'game-escape'},'*');})();
</script>
