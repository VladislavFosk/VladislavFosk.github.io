<!-- COMPACT MUSIC PLAYER -->
<div class="music-player" id="musicPlayer">
    <div class="music-panel" id="musicPanel">
        <div class="music-top">
            <div class="music-cover">♫</div>

            <div class="music-info">
                <div class="music-label">NOW PLAYING</div>
                <div class="music-title" id="musicTitle">Dead season</div>
                <div class="music-status" id="musicStatus">Готов к воспроизведению</div>
            </div>

            <button class="music-close" id="musicClose" type="button" aria-label="Закрыть плеер">×</button>
        </div>

        <div class="music-progress">
            <span id="musicCurrent">0:00</span>
            <input type="range" id="musicSeek" min="0" max="100" value="0" step="0.1" aria-label="Позиция воспроизведения">
            <span id="musicDuration">0:00</span>
        </div>

        <div class="music-bottom">
            <div class="music-controls">
                <button id="musicPrev" type="button" aria-label="Предыдущий трек">⏮</button>
                <button id="musicPlay" class="music-play" type="button" aria-label="Воспроизвести">▶</button>
                <button id="musicNext" type="button" aria-label="Следующий трек">⏭</button>
            </div>

            <label class="music-volume">
                <span aria-hidden="true">♬</span>
                <input type="range" id="musicVolume" min="0" max="1" value="0.7" step="0.01" aria-label="Громкость">
            </label>
        </div>
    </div>

    <button class="music-toggle" id="musicToggle" type="button" aria-label="Открыть музыкальный плеер" aria-expanded="false">
        <span class="music-toggle-note">♫</span>
        <span class="music-bars" aria-hidden="true">
            <i></i><i></i><i></i><i></i>
        </span>
    </button>

    <audio id="musicAudio" preload="metadata"></audio>
</div>

<style>
/* Компактный музыкальный плеер */
.music-player {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 9999;
    font-family: inherit;
}

.music-player button {
    font-family: inherit;
}

.music-toggle {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    padding: 0;
    border: 1px solid rgba(190, 105, 255, .4);
    border-radius: 12px;
    background: linear-gradient(145deg, #1e1126, #0c0810);
    color: #c77dff;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(0, 0, 0, .4);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: transform .2s ease, border-color .2s ease;
}

.music-toggle:hover {
    transform: translateY(-2px);
    border-color: rgba(190, 105, 255, .8);
}

.music-toggle-note {
    font-size: 20px;
}

.music-bars {
    position: absolute;
    right: 6px;
    bottom: 6px;
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 10px;
    opacity: 0;
}

.music-bars i {
    display: block;
    width: 2px;
    height: 4px;
    border-radius: 2px;
    background: #c77dff;
}

.music-bars i:nth-child(2) { height: 8px; }
.music-bars i:nth-child(3) { height: 6px; }
.music-bars i:nth-child(4) { height: 10px; }

.music-player.playing .music-bars {
    opacity: 1;
}

.music-player.playing .music-bars i {
    animation: musicBars .7s ease-in-out infinite alternate;
}

.music-player.playing .music-bars i:nth-child(2) { animation-delay: -.2s; }
.music-player.playing .music-bars i:nth-child(3) { animation-delay: -.4s; }
.music-player.playing .music-bars i:nth-child(4) { animation-delay: -.1s; }

@keyframes musicBars {
    from { transform: scaleY(.4); }
    to { transform: scaleY(1); }
}

.music-panel {
    position: absolute;
    right: 0;
    bottom: 54px;
    width: 260px;
    box-sizing: border-box;
    padding: 13px;
    border: 1px solid rgba(190, 105, 255, .3);
    border-radius: 13px;
    background: linear-gradient(145deg, rgba(24, 14, 30, .98), rgba(10, 7, 13, .98));
    box-shadow: 0 12px 35px rgba(0, 0, 0, .5);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translateY(8px) scale(.97);
    transform-origin: bottom right;
    transition: opacity .2s ease, transform .2s ease, visibility .2s;
}

.music-player.open .music-panel {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transform: translateY(0) scale(1);
}

.music-top {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 12px;
}

.music-cover {
    display: flex;
    flex: 0 0 36px;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border: 1px solid rgba(190, 105, 255, .25);
    border-radius: 9px;
    background: rgba(190, 105, 255, .12);
    color: #c77dff;
    font-size: 19px;
}

.music-info {
    flex: 1;
    min-width: 0;
}

.music-label {
    margin-bottom: 3px;
    color: rgba(199, 125, 255, .75);
    font-size: 8px;
    letter-spacing: 1.2px;
}

.music-title {
    overflow: hidden;
    color: var(--text, #fff);
    font-size: 12px;
    font-weight: 600;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.music-status {
    overflow: hidden;
    margin-top: 3px;
    color: var(--text2, #aaa);
    font-size: 10px;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.music-close {
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 25px;
    width: 25px;
    height: 25px;
    padding: 0;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: rgba(255, 255, 255, .6);
    cursor: pointer;
    font-size: 19px;
}

.music-close:hover {
    background: rgba(255, 255, 255, .08);
    color: #fff;
}

.music-progress {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 12px;
    color: rgba(255, 255, 255, .55);
    font-size: 9px;
    font-variant-numeric: tabular-nums;
}

.music-progress input {
    flex: 1;
    min-width: 0;
    margin: 0;
    accent-color: #c77dff;
    cursor: pointer;
}

.music-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
}

.music-controls {
    display: flex;
    align-items: center;
    gap: 5px;
}

.music-controls button {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    padding: 0;
    border: 1px solid rgba(255, 255, 255, .12);
    border-radius: 8px;
    background: rgba(255, 255, 255, .05);
    color: rgba(255, 255, 255, .85);
    cursor: pointer;
    font-size: 11px;
}

.music-controls button:hover {
    border-color: rgba(190, 105, 255, .4);
    background: rgba(190, 105, 255, .15);
}

.music-controls .music-play {
    width: 36px;
    height: 36px;
    border-color: rgba(190, 105, 255, .4);
    border-radius: 50%;
    background: rgba(190, 105, 255, .16);
    color: #d9a5ff;
    font-size: 13px;
}

.music-volume {
    display: flex;
    align-items: center;
    gap: 5px;
    color: rgba(255, 255, 255, .65);
    font-size: 12px;
}

.music-volume input {
    width: 55px;
    margin: 0;
    accent-color: #c77dff;
    cursor: pointer;
}

@media (max-width: 600px) {
    .music-player {
        right: 10px;
        bottom: 10px;
    }

    .music-toggle {
        width: 40px;
        height: 40px;
    }

    .music-panel {
        bottom: 49px;
        width: min(260px, calc(100vw - 24px));
    }
}

@media (prefers-reduced-motion: reduce) {
    .music-toggle,
    .music-panel {
        transition: none;
    }

    .music-player.playing .music-bars i {
        animation: none;
    }
}
</style>

<script>
(function () {
    "use strict";

    const audio = document.getElementById("musicAudio");
    const player = document.getElementById("musicPlayer");
    const toggle = document.getElementById("musicToggle");
    const close = document.getElementById("musicClose");
    const playButton = document.getElementById("musicPlay");
    const prevButton = document.getElementById("musicPrev");
    const nextButton = document.getElementById("musicNext");
    const title = document.getElementById("musicTitle");
    const status = document.getElementById("musicStatus");
    const seek = document.getElementById("musicSeek");
    const current = document.getElementById("musicCurrent");
    const duration = document.getElementById("musicDuration");
    const volume = document.getElementById("musicVolume");

    if (
        !audio || !player || !toggle || !close ||
        !playButton || !prevButton || !nextButton ||
        !title || !status || !seek || !current ||
        !duration || !volume
    ) {
        return;
    }

    const tracks = [
        { title: "Dead season", src: "music/Dead%20season.mp3" },
        { title: "nebo", src: "music/nebo.mp3" },
        { title: "theme", src: "music/theme.mp3" }
    ];

    let trackIndex = 0;
    let seeking = false;

    function formatTime(seconds) {
        if (!Number.isFinite(seconds) || seconds < 0) {
            return "0:00";
        }

        const minutes = Math.floor(seconds / 60);
        const secondsPart = Math.floor(seconds % 60)
            .toString()
            .padStart(2, "0");

        return minutes + ":" + secondsPart;
    }

    function updatePlayButton() {
        const isPlaying = !audio.paused;

        playButton.textContent = isPlaying ? "Ⅱ" : "▶";
        playButton.setAttribute(
            "aria-label",
            isPlaying ? "Пауза" : "Воспроизвести"
        );

        player.classList.toggle("playing", isPlaying);
    }

    function loadTrack(index, autoplay) {
        trackIndex = (index + tracks.length) % tracks.length;

        const track = tracks[trackIndex];

        audio.src = track.src;
        title.textContent = track.title;
        status.textContent = "Готов к воспроизведению";
        current.textContent = "0:00";
        duration.textContent = "0:00";
        seek.value = 0;

        audio.load();
        updatePlayButton();

        if (autoplay) {
            audio.play().catch(function () {
                status.textContent = "Нажмите ▶ для запуска";
                updatePlayButton();
            });
        }
    }

    toggle.addEventListener("click", function () {
        const isOpen = player.classList.toggle("open");
        toggle.setAttribute("aria-expanded", String(isOpen));
    });

    close.addEventListener("click", function () {
        player.classList.remove("open");
        toggle.setAttribute("aria-expanded", "false");
    });

    playButton.addEventListener("click", function () {
        if (audio.paused) {
            audio.play().catch(function () {
                status.textContent = "Не удалось запустить трек";
            });
        } else {
            audio.pause();
        }
    });

    prevButton.addEventListener("click", function () {
        loadTrack(trackIndex - 1, true);
    });

    nextButton.addEventListener("click", function () {
        loadTrack(trackIndex + 1, true);
    });

    audio.addEventListener("play", function () {
        status.textContent = "Сейчас играет";
        updatePlayButton();
    });

    audio.addEventListener("pause", updatePlayButton);

    audio.addEventListener("loadedmetadata", function () {
        duration.textContent = formatTime(audio.duration);
    });

    audio.addEventListener("timeupdate", function () {
        current.textContent = formatTime(audio.currentTime);

        if (!seeking && Number.isFinite(audio.duration) && audio.duration > 0) {
            seek.value = (audio.currentTime / audio.duration) * 100;
        }
    });

    seek.addEventListener("input", function () {
        seeking = true;

        if (Number.isFinite(audio.duration) && audio.duration > 0) {
            current.textContent = formatTime(
                (Number(seek.value) / 100) * audio.duration
            );
        }
    });

    seek.addEventListener("change", function () {
        if (Number.isFinite(audio.duration) && audio.duration > 0) {
            audio.currentTime = (Number(seek.value) / 100) * audio.duration;
        }

        seeking = false;
    });

    volume.addEventListener("input", function () {
        audio.volume = Number(volume.value);
    });

    audio.addEventListener("ended", function () {
        loadTrack(trackIndex + 1, true);
    });

    audio.addEventListener("error", function () {
        status.textContent = "Не удалось загрузить файл";
        updatePlayButton();
    });

    audio.volume = Number(volume.value);
    loadTrack(0, false);
})();
</script>
